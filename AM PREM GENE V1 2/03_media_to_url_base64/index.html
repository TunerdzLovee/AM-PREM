<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media to URL — LAXX TOOLS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/01.css">
</head>
<body>
  

    <!-- Tombol Kembali -->

    <!-- Header -->
    <div class="type-row">
      <div class="type-btn aktif" data-tipe="image" onclick="pilihTipe('image', this)">
        <i class="fas fa-image type-icon"></i>
        <span class="type-label">FOTO</span>
      </div>
      <div class="type-btn" data-tipe="video" onclick="pilihTipe('video', this)">
        <i class="fas fa-video type-icon"></i>
        <span class="type-label">VIDEO</span>
      </div>
      <div class="type-btn" data-tipe="audio" onclick="pilihTipe('audio', this)">
        <i class="fas fa-music type-icon"></i>
        <span class="type-label">AUDIO</span>
      </div>
      <div class="type-btn" data-tipe="*" onclick="pilihTipe('*', this)">
        <i class="fas fa-file type-icon"></i>
        <span class="type-label">SEMUA</span>
      </div>
    </div>

    <!-- Upload Zone -->
    <div class="upload-zone" id="uploadZone" onclick="pilihFile()">
      <i class="fas fa-cloud-upload-alt upload-icon"></i>
      <div class="upload-text">KETUK / SERET FILE</div>
      <input type="file" id="inputFile" onchange="saatDipilih(this)" />
    </div>

    <!-- Info File -->
    <div class="file-info" id="fileInfo"></div>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>

    <!-- Tombol Upload -->
    <button class="upload-btn" id="btnUpload" onclick="mulaiUpload()" disabled>upload</button>

    <!-- Link Hasil -->
    <div class="link-label">link</div>
    <div class="link-box" id="linkBox"></div>
    <button class="copy-btn" id="copyBtn" onclick="salinLink()">📋 SALIN LINK</button>

    <img id="previewImg" class="preview-media" alt="preview" />
    <video id="previewVid" class="preview-media" controls style="width:100%;"></video>
    <audio id="previewAud" class="preview-media" controls style="width:100%;"></audio>

    <div class="error-box" id="errorBox"></div>
    <a href="https://catbox.moe/" target="_blank" class="catbox-btn" id="catboxBtn">
      📦 UPLOAD PERMANEN — BUKA CATBOX
    </a>

  <script src="js/01.js"></script>
</body>
</html>
